<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10141b"><title>Street Lines</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10141b;color:#fff;font:14px system-ui;touch-action:none}#game{position:absolute;inset:0}canvas{width:100%;height:100%;display:block}#hud{position:absolute;inset:0;padding:15px;pointer-events:none}.brand{font-weight:900;letter-spacing:1px}.brand span{color:#61f2d5}#score,#tip,#msg{position:absolute;background:#111923d9;border:1px solid #ffffff30;border-radius:10px;padding:9px 11px;font-size:12px}#score{top:43px;left:15px}#tip{top:15px;right:15px}#msg{top:91px;left:50%;transform:translateX(-50%);white-space:nowrap}#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 17px;pointer-events:none}#stick{width:128px;height:128px;border:2px solid #ffffff70;background:#11192388;border-radius:50%;position:relative;pointer-events:auto;touch-action:none}#nub{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:50%;background:#e9f2ffdc;border:2px solid white}#buttons{display:grid;grid-template-columns:repeat(2,65px);gap:9px;pointer-events:auto}.btn{height:58px;border-radius:16px;border:1px solid #ffffff77;background:#111923dd;color:white;font-weight:800;font-size:11px;touch-action:none}.btn:active,.btn.on{background:#61f2d5;color:#111923}#jump{grid-column:2;grid-row:1;height:68px;border-radius:50%}#flip{grid-column:1;grid-row:2}#grind{grid-column:2;grid-row:2}#reset{position:absolute;right:15px;top:75px;pointer-events:auto;background:#111923dd;color:white;border:1px solid #ffffff44;border-radius:8px;padding:7px;font-size:10px}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#10141b;z-index:5;text-align:center;padding:25px}#loading small{display:block;color:#aab4c4;margin-top:8px;max-width:280px}
</style></head><body><div id="game"></div><div id="hud"><div class="brand">STREET <span>LINES</span></div><div id="score">PONTOS <b id="points">0</b> · VELOCIDADE <b id="speed">0</b></div><div id="tip">Use o direcional para andar</div><div id="msg">Explore o skatepark e mande manobras!</div><button id="reset">REINICIAR</button><div id="controls"><div id="stick"><div id="nub"></div></div><div id="buttons"><button class="btn" id="jump">OLLIE</button><button class="btn" id="flip">FLIP</button><button class="btn" id="grind">GRIND</button></div></div></div><div id="loading"><div><b>STREET LINES</b><small id="loadtext">Carregando skatepark 3D…</small></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{const loading=document.getElementById('loading'),lt=document.getElementById('loadtext');if(!window.THREE){lt.textContent='Motor 3D não carregou. Confira a internet e recarregue.';return}
const root=document.getElementById('game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc9d7);scene.fog=new THREE.Fog(0x9cc9d7,35,90);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,120),renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);root.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe5f5ff,0x59645b,2));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-10,20,8);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:1});function box(w,h,d,x,y,z,c,parent=scene){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);parent.add(m);return m}
box(100,.25,100,0,-.16,0,0x777f7b);for(let i=-40;i<=40;i+=8)box(.05,.012,80,i,-.025,0,0x929b94);
function ramp(w,h,d,x,y,z,c,rz){let m=box(w,h,d,x,y,z,c);m.rotation.z=rz}
ramp(7,.35,5,-7,.05,-4,0x8e999b,-.22);ramp(7,.35,5,9,.05,-7,0x8e999b,.22);box(5,.55,1.3,0,.12,-11,0x454e55);box(5,.08,1.3,0,.44,-11,0xabb6b7);box(7,.35,1.2,-13,.05,7,0x525d65);box(7,.08,1.2,-13,.25,7,0xb7c0c0);
function rail(a,b){let p=new THREE.Vector3(...a),q=new THREE.Vector3(...b),v=q.clone().sub(p),o=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,v.length(),8),mat(0xc6d0d4));o.position.copy(p).add(q).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());scene.add(o);[p,q].forEach(t=>box(.09,.65,.09,t.x,t.y-.34,t.z,0x68757b))}
rail([-4,.65,3],[4,.65,3]);rail([5,.7,-3],[10,.7,-3]);for(let i=0;i<5;i++)box(1,.18,1,15+i*1.15,.1,8,0xe8b84f);box(42,2,.5,0,.8,-22,0x526b70);box(.5,2,35,-23,.8,-4,0x617d76);box(.5,2,35,23,.8,-4,0x617d76);for(let i=0;i<9;i++)box(.3,1.6,.3,-18+i*4,.8,-21,i%2?0x61d8c2:0xf2b55b);
const skater=new THREE.Group();scene.add(skater);function limb(w,h,d,x,y,z,c,parent=skater){return box(w,h,d,x,y,z,c,parent)}limb(.48,.62,.28,0,1.18,0,0x232a36);let head=new THREE.Mesh(new THREE.SphereGeometry(.19,8,6),mat(0xc9906e));head.position.y=1.64;skater.add(head);limb(.19,.58,.2,-.15,.62,0,0x343e50);limb(.19,.58,.2,.15,.62,0,0x343e50);limb(.25,.12,.34,-.15,.31,-.05,0x11151b);limb(.25,.12,.34,.15,.31,-.05,0x11151b);limb(.14,.52,.14,-.34,1.18,0,0xc9906e);limb(.14,.52,.14,.34,1.18,0,0xc9906e);
const board=new THREE.Group();skater.add(board);limb(.86,.09,.25,0,.13,0,0x232b35,board);limb(.7,.012,.21,0,.185,0,0x4adbc5,board);for(let x of [-.28,.28]){limb(.06,.08,.3,x,.06,0,0xb3bdc4,board);for(let z of [-.14,.14]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,.055,8),mat(0x171b20));w.rotation.x=Math.PI/2;w.position.set(x,.02,z);board.add(w)}}
let pos=new THREE.Vector3(0,0,13),vel=new THREE.Vector3(),yaw=Math.PI,air=0,points=0,grinding=false,flipping=false;const stick=document.getElementById('stick'),nub=document.getElementById('nub');let ix=0,iy=0,pid=null;function stickMove(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),s=Math.min(1,l/43);ix=dx/(l||1)*s;iy=dy/(l||1)*s;nub.style.left=(38+ix*33)+'px';nub.style.top=(38+iy*33)+'px'}stick.addEventListener('pointerdown',e=>{pid=e.pointerId;stick.setPointerCapture(pid);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===pid)stickMove(e)});function stop(){pid=null;ix=iy=0;nub.style.left='38px';nub.style.top='38px'}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);
function msg(t){document.getElementById('msg').textContent=t}document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(!air){air=.01;vel.y=5.7;points+=10;msg('OLLIE! +10')}});document.getElementById('flip').addEventListener('pointerdown',e=>{e.preventDefault();if(air){flipping=true;points+=50;msg('FLIP! +50')}else msg('Pule primeiro com OLLIE!')});document.getElementById('grind').addEventListener('pointerdown',e=>{e.preventDefault();grinding=!grinding;document.getElementById('grind').classList.toggle('on',grinding);msg(grinding?'GRIND experimental ativado':'GRIND desativado')});document.getElementById('reset').addEventListener('click',()=>{pos.set(0,0,13);vel.set(0,0,0);yaw=Math.PI;air=0;points=0;flipping=false;msg('Skatepark reiniciado')});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.033),f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));vel.addScaledVector(f,-iy*7*dt);vel.addScaledVector(r,ix*6*dt);vel.x*=Math.pow(.94,dt*60);vel.z*=Math.pow(.94,dt*60);let speed=Math.hypot(vel.x,vel.z);if(speed>.18)yaw=Math.atan2(vel.x,vel.z);if(air>0){vel.y-=12*dt;pos.y+=vel.y*dt;if(pos.y<=0){pos.y=0;air=0;vel.y=0;flipping=false;board.rotation.set(0,0,0);msg(grinding?'GRIND ativado':'Continue explorando o skatepark!')}}pos.add(new THREE.Vector3(vel.x*dt,0,vel.z*dt));pos.x=Math.max(-20,Math.min(20,pos.x));pos.z=Math.max(-20,Math.min(20,pos.z));skater.position.set(pos.x,pos.y+(air?0:Math.sin(Date.now()*.012)*Math.min(speed*.015,.04)),pos.z);skater.rotation.y=yaw;board.rotation.z=flipping?Math.sin(Date.now()*.025)*.55:0;board.rotation.x=flipping?Math.sin(Date.now()*.025)*.8:0;let target=new THREE.Vector3(pos.x-Math.sin(yaw)*6,2.8+pos.y,pos.z-Math.cos(yaw)*6);camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(pos.x,pos.y+1,pos.z+2);document.getElementById('speed').textContent=Math.round(speed*10);document.getElementById('points').textContent=points;renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.4))});loading.style.display='none';animate()})();
</script></body></html>
